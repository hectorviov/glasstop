name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version && xcodebuild -version

      - name: Build (warnings are errors)
        run: swift build -c release -Xswiftc -warnings-as-errors

      - name: Bundle
        run: ./scripts/bundle.sh
