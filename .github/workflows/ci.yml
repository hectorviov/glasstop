name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    # Intel: GitHub's Apple silicon pool often queues for a long time. The release (built on
    # Apple silicon) is what ships; CI compiles for both architectures to catch either breaking.
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: swift --version && xcodebuild -version

      - name: Build (warnings are errors)
        run: swift build -c release -Xswiftc -warnings-as-errors

      - name: Build for Apple silicon (warnings are errors)
        run: swift build -c release --arch arm64 -Xswiftc -warnings-as-errors

      - name: Bundle
        run: ./scripts/bundle.sh

      - name: Disk image
        run: |
          python3 -m venv "$RUNNER_TEMP/dmgbuild"     # Homebrew Python refuses global pip installs
          "$RUNNER_TEMP/dmgbuild/bin/pip" install --quiet "dmgbuild==1.6.7"
          export PATH="$RUNNER_TEMP/dmgbuild/bin:$PATH"
          ./scripts/make-dmg.sh
