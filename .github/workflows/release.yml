name: Release

# Push a tag like v0.9.1 to publish a release. "Run workflow" (manual) builds a *draft*
# release instead, for checking the pipeline without publishing anything.
#
# With the signing secrets set (see README → "Signing and notarization"), the app and the
# disk image are signed with the Developer ID, notarized by Apple and stapled, so Gatekeeper
# opens them without a warning. Without them the release is ad-hoc signed, as before.
#
# Runs on GitHub's Intel macOS runners (the Apple silicon pool is often too busy to get a
# machine) and cross-compiles the arm64 app, so the host architecture doesn't matter. The
# repository variable RELEASE_RUNNER can name other runner labels as JSON, e.g.
# ["self-hosted", "macOS", "ARM64", "glasstop-release"] for a self-hosted Mac. Only this
# workflow should use a self-hosted runner: it can only be started by people with write
# access, unlike CI, which runs code from pull requests.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version for the draft release (e.g. 0.9.1)
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ${{ fromJSON(vars.RELEASE_RUNNER || '"macos-26-intel"') }}
    env:
      SIGNED: ${{ secrets.MACOS_CERTIFICATE_P12 != '' && secrets.NOTARY_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            version="${GITHUB_REF_NAME#v}"; draft=""
          else
            version="$INPUT_VERSION"; draft="--draft"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$version' isn't a version like 1.2.3 or 1.2.3-beta.1"; exit 1
          fi
          prerelease=""; [[ "$version" == *-* ]] && prerelease="--prerelease"
          {
            echo "version=$version"
            echo "draft=$draft"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

      - name: Signing keychain
        if: env.SIGNED == 'true'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          # On a self-hosted Mac this is the user's own keychain list: remember it, so the
          # clean-up step can put it back exactly.
          security list-keychains -d user | tr -d '"' | sed 's/^ *//' > "$RUNNER_TEMP/keychains-before"
          keychain_password=$(uuidgen)
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          # Developer ID intermediate, in case the .p12 doesn't carry the chain.
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain" || true
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

          identity=$(security find-identity -v -p codesigning "$keychain" \
            | sed -nE 's/.*"(Developer ID Application: [^"]+)".*/\1/p' | head -1)
          if [[ -z "$identity" ]]; then
            echo "::error::The certificate has no 'Developer ID Application' identity"; exit 1
          fi
          echo "Signing as: $identity"
          printf '%s' "$NOTARY_API_KEY" > "$RUNNER_TEMP/notary-key.p8"
          {
            echo "SIGN_IDENTITY=$identity"
            echo "SIGNING_KEYCHAIN=$keychain"
            echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notary-key.p8"
            echo "NOTARY_KEY_ID=$NOTARY_KEY_ID"
            echo "NOTARY_ISSUER_ID=$NOTARY_ISSUER_ID"
          } >> "$GITHUB_ENV"

      - name: Build
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
          ARCH: arm64                      # Glasstop is Apple silicon only
        run: |
          swift --version
          ./scripts/bundle.sh
          archs=$(lipo -archs build/Glasstop.app/Contents/MacOS/Glasstop)
          echo "Architectures: $archs"
          [[ "$archs" == "arm64" ]] || { echo "::error::expected an arm64 binary, got '$archs'"; exit 1; }

      - name: Notarize app
        if: env.SIGNED == 'true'
        run: |
          ditto -c -k --keepParent build/Glasstop.app "$RUNNER_TEMP/Glasstop-notarize.zip"
          ./scripts/notarize.sh "$RUNNER_TEMP/Glasstop-notarize.zip"
          xcrun stapler staple build/Glasstop.app       # works offline once copied out of the DMG
          spctl --assess --type execute --verbose=2 build/Glasstop.app

      - name: Disk image
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 -m venv "$RUNNER_TEMP/dmgbuild"     # Homebrew Python refuses global pip installs
          "$RUNNER_TEMP/dmgbuild/bin/pip" install --quiet "dmgbuild==1.6.7"
          export PATH="$RUNNER_TEMP/dmgbuild/bin:$PATH"
          ./scripts/make-dmg.sh "Glasstop-$VERSION.dmg"

      - name: Notarize disk image
        if: env.SIGNED == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ./scripts/notarize.sh "Glasstop-$VERSION.dmg"
          spctl --assess --type open --context context:primary-signature --verbose=2 "Glasstop-$VERSION.dmg"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          DRAFT: ${{ steps.version.outputs.draft }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          dmg="Glasstop-$VERSION.dmg"
          shasum -a 256 "$dmg" > "$dmg.sha256"
          cat "$dmg.sha256"
          cat > notes.md <<'EOF'
          **Install:** download `Glasstop-*.dmg`, open it and drag Glasstop to Applications.
          Requires an Apple silicon Mac with macOS 14 Sonoma or later.
          EOF
          if [[ "$SIGNED" != "true" ]]; then
            cat >> notes.md <<'EOF'

          This build is ad-hoc signed, not notarized, so macOS blocks the first launch: open it once,
          then go to System Settings → Privacy & Security and click **Open Anyway**
          (or run `xattr -dr com.apple.quarantine /Applications/Glasstop.app`).
          EOF
          fi
          gh release create "v$VERSION" "$dmg" "$dmg.sha256" \
            --title "Glasstop $VERSION" --target "$GITHUB_SHA" \
            --notes-file notes.md --generate-notes $DRAFT $PRERELEASE

      - name: Clean up signing material
        if: always()
        run: |
          [[ -n "${SIGNING_KEYCHAIN:-}" ]] && security delete-keychain "$SIGNING_KEYCHAIN" || true
          if [[ -s "$RUNNER_TEMP/keychains-before" ]]; then
            keychains=()
            while IFS= read -r line; do [[ -n "$line" ]] && keychains+=("$line"); done < "$RUNNER_TEMP/keychains-before"
            security list-keychains -d user -s "${keychains[@]}"
            rm "$RUNNER_TEMP/keychains-before"
          fi
          rm -f "$RUNNER_TEMP/notary-key.p8" "$RUNNER_TEMP/certificate.p12"
