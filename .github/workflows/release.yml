name: Release

# Push a tag like v0.9.1 to publish a release. "Run workflow" (manual) builds a *draft*
# release instead, for checking the pipeline without publishing anything.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version for the draft release (e.g. 0.9.1)
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            version="${GITHUB_REF_NAME#v}"; draft=""
          else
            version="$INPUT_VERSION"; draft="--draft"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$version' isn't a version like 1.2.3 or 1.2.3-beta.1"; exit 1
          fi
          prerelease=""; [[ "$version" == *-* ]] && prerelease="--prerelease"
          {
            echo "version=$version"
            echo "draft=$draft"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          swift --version
          ./scripts/bundle.sh

      - name: Package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          zip="Glasstop-$VERSION.zip"
          ditto -c -k --keepParent build/Glasstop.app "$zip"
          shasum -a 256 "$zip" > "$zip.sha256"
          cat "$zip.sha256"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          DRAFT: ${{ steps.version.outputs.draft }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          cat > notes.md <<'EOF'
          **Install:** download `Glasstop-*.zip`, unzip, and move `Glasstop.app` to Applications.
          Requires an Apple silicon Mac with macOS 14 Sonoma or later.

          The app is ad-hoc signed, not notarized, so macOS blocks the first launch: open it once,
          then go to System Settings → Privacy & Security and click **Open Anyway**
          (or run `xattr -dr com.apple.quarantine /Applications/Glasstop.app`).
          EOF
          gh release create "v$VERSION" "Glasstop-$VERSION.zip" "Glasstop-$VERSION.zip.sha256" \
            --title "Glasstop $VERSION" --target "$GITHUB_SHA" \
            --notes-file notes.md --generate-notes $DRAFT $PRERELEASE
